name: Fetch image assets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  fetch-images:
    name: Download and commit image assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download images
        run: node scripts/fetch-images.mjs

      - name: Verify data, translations and image files
        run: node scripts/verify.mjs

      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img thumbs
          if git diff --cached --quiet; then
            echo "Images already present; nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh image assets"
          git push
