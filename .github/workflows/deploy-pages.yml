name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'costume.html'
      - 'face.html'
      - 'assets/**'
      - 'data/**'
      - 'img/**'
      - 'thumbs/**'
      - 'costume/**'
      - 'portrait/**'
      - 'og-cover.jpg'
      - 'robots.txt'
      - '.nojekyll'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage only site files
        run: |
          mkdir -p _site/portrait
          cp index.html costume.html face.html og-cover.jpg robots.txt .nojekyll _site/
          cp -R assets data img thumbs costume _site/
          cp -R portrait/thumbs _site/portrait/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
